<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crafix — From imagination to sales</title>
<style>
:root{--sage:#e6eee1;--cream:#fbf7eb;--green:#174c3b;--mid:#397653;--muted:#718071}
*{box-sizing:border-box}body{margin:0;background:var(--sage);color:var(--green);font:16px Arial,sans-serif}
header{max-width:1100px;margin:18px auto 0;background:var(--cream);border-radius:20px;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font: bold 28px Georgia,serif;display:flex;align-items:center;gap:10px}nav{display:flex;gap:22px;flex-wrap:wrap}button{cursor:pointer;border:0;color:inherit;background:none;font:inherit}nav button{font-weight:bold}
main{max-width:1100px;margin:18px auto;padding:0 12px}.hero,.card{background:var(--cream);border-radius:22px;padding:clamp(22px,5vw,52px)}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:350px}
h1{font:clamp(34px,5vw,48px)/1.12 Georgia,serif;margin:16px 0;color:#103c30}h2{font: bold 30px Georgia,serif;margin:0 0 12px}.muted{color:var(--muted);line-height:1.6}.eyebrow{display:inline-block;background:#e7ead6;border-radius:30px;padding:9px 14px;font-size:10px;letter-spacing:2px;font-weight:bold}
.primary,.secondary{border-radius:12px;padding:12px 18px;font-weight:bold;margin-top:12px}.primary{background:var(--green);color:white}.secondary{background:#edf1e8;border:1px solid #dce5d8}.primary:disabled{opacity:.4;cursor:not-allowed}
.illustration{background:linear-gradient(145deg,#e8eddb,#f4f0df);border-radius:22px;min-height:260px;display:grid;place-items:center;padding:18px}
.bottom{text-align:center;padding:28px 0 45px}.bottom small{letter-spacing:3px;font-weight:bold;color:#496653}.symbols{display:flex;justify-content:center;gap:18px;margin-top:18px}.symbols span{width:46px;height:46px;border:2px solid var(--mid);border-radius:50%;display:grid;place-items:center;font-size:23px}
.card{margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{background:#fffdf7;border:1px solid #e0e5d9;border-radius:14px;padding:15px;text-align:left;display:flex;gap:12px;align-items:center}.tile .ico{font-size:25px;color:var(--mid)}
.field{width:100%;border:1px solid #d9e0d2;border-radius:10px;padding:11px;background:white;color:var(--green);margin:5px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.steps{display:flex;justify-content:space-between;margin:20px 0}.step{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e7eadb;font-weight:bold}.step.active{background:var(--green);color:white}.step.done{background:#d3e8d2}
.drop{display:block;border:2px dashed #b6c9b3;border-radius:15px;padding:28px;text-align:center;background:#f0f2e8;cursor:pointer}.file{display:flex;align-items:center;gap:10px;border:1px solid #e0e5d9;border-radius:12px;padding:12px;margin:8px 0}.file .name{flex:1;overflow-wrap:anywhere}.status{font-weight:bold}.ok{color:#287447}.spin{width:17px;height:17px;border:2px solid #dce3d7;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
textarea{resize:vertical} .chatmsg{background:#dce9d9;border-radius:12px;padding:12px;margin:8px 0 8px auto;max-width:85%}
@media(max-width:620px){header{margin:10px;padding:14px}.hero{grid-template-columns:1fr}.illustration{min-height:210px}nav{gap:12px}}
</style></head>
<body>
<header><button class="brand" onclick="home()"><svg width="34" height="34" viewBox="0 0 40 40"><path fill="#4e8965" d="M5 29Q7 9 25 5Q23 24 5 29Z"/><path fill="#174c3b" d="M20 34Q21 14 37 10Q37 28 20 34Z"/></svg>Crafix</button><nav><button onclick="home()">⌂ Home</button><button onclick="genresPage()">♧ Explore Ideas</button><button onclick="tutorialPage()">Publish</button></nav></header>
<main id="app"></main>
<script>
const app=document.querySelector('#app');let slide=0,read=[],format='',files=[],genres=[],answers={},section=0,chat=[],storyTitle='',publishSummary='';
const lessons=[['Scan or download','Scan handwritten pages or download your digital document.'],['Write a summary in the margin','Write a short summary so reviewers understand your story.'],['Upload to the drive','Upload your work and keep the files organized.'],['Move to the site','Move your files to the publishing site.'],['If criticism is received, revise.','Read criticism carefully and revise your work when necessary.']];
const genreList=['Fantasy','Adventure','Mystery','Science Fiction','Comedy','Drama','Horror','Historical','Romance','Action'];
const quiz=[['Character Information',['Character name','Age','Appearance','Personality','Strengths and weaknesses','Motivations and fears','Background and relationships']],['Story and Plot',['Story summary','Main character’s goal','Central problem','Setting','What makes the story unique?','Obstacles']],['Character Arcs',['How does the character begin?','What challenges change them?','What lessons do they learn?','How do they behave at the end?','What kind of character arc?']],['Six Story Elements',['Introduction: How does your story begin?','Conflict: What problem does your main character face?','Rising Action: What obstacles make solving the problem difficult?','Climax: What is the biggest moment in your story?','Falling Action: What happens after the major confrontation?','Resolution: How does your story end?']]];
function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">YOUR STORY STARTS HERE</span><h1>From imagination<br>to sales.</h1><p class="muted">Self-publishing your book or comic starts with an idea.</p><button class="primary" onclick="startPage()">Start →</button></div><div class="illustration"><svg viewBox="0 0 340 250" width="100%" style="max-width:330px"><path d="M165 190Q103 143 40 166L44 205Q107 185 165 224Q224 185 291 205L295 166Q230 143 165 190Z" fill="#fffdf2" stroke="#659477" stroke-width="3"/><path d="M165 190V224M61 177Q111 161 153 192M179 192Q226 162 275 177" fill="none" stroke="#aac8a5" stroke-width="2.5"/><path d="M165 190V82" stroke="#326c4c" stroke-width="7" stroke-linecap="round"/><path d="M165 112Q98 108 91 68Q147 65 165 112Z" fill="#8eb98a"/><path d="M165 116Q170 47 237 43Q233 99 165 116Z" fill="#397b56"/></svg></div></section><div class="bottom"><small>A PLACE FOR STORIES TO TAKE SHAPE</small><div class="symbols"><span>♧</span><span>▤</span><span>✧</span></div></div>`}
function startPage(){app.innerHTML=`<section class="card"><h2>Where would you like to start?</h2><div class="grid"><button class="tile" onclick="tutorialPage()"><span class="ico">▤</span><span><b>Publish</b><p class="muted">I already have a story to publish.</p></span></button><button class="tile" onclick="genresPage()"><span class="ico">✧</span><span><b>Explore Ideas</b><p class="muted">Help me develop a story idea.</p></span></button></div></section>`}
function tutorialPage(){app.innerHTML=`<section class="card"><h2>Publishing guide</h2><p class="muted">Read all five steps to continue.</p><div class="steps">${lessons.map((x,i)=>`<span class="step ${slide===i?'active':read.includes(i)?'done':''}">${read.includes(i)?'✓':i+1}</span>`).join('')}</div><div class="card" style="background:#edf1e5;text-align:center"><p class="muted">STEP ${slide+1} OF 5</p><h2>${lessons[slide][0]}</h2><p class="muted">${lessons[slide][1]}</p></div><div class="row"><button class="secondary" onclick="slide=Math.max(0,slide-1);tutorialPage()">← Previous</button><button class="secondary" onclick="slide=Math.min(4,slide+1);tutorialPage()">Next →</button></div><button class="secondary" onclick="read.includes(slide)||read.push(slide);tutorialPage()">${read.includes(slide)?'✓ Marked as read':'Mark as read'}</button><br><button class="primary" ${read.length!==5?'disabled':''} onclick="formatsPage()">Continue →</button></section>`}
function formatsPage(){app.innerHTML=`<section class="card"><h2>Choose your format</h2><p class="muted">What are you publishing?</p><div class="grid">${['Book','Comic','Graphic novel'].map(f=>`<button class="tile" onclick="format='${f}';formatsPage()"><span class="ico">▤</span><b>${f} ${format===f?'✓':''}</b></button>`).join('')}</div><button class="primary" ${!format?'disabled':''} onclick="uploadPage()">Continue to upload</button></section>`}
function uploadPage(){app.innerHTML=`<section class="card"><h2>Upload your ${format.toLowerCase()}</h2><p class="muted">Select files or drag and drop them below.</p><label class="drop" id="drop"><span class="ico" style="font-size:30px">⇧</span><br><b>Choose files or drop them here</b><p class="muted">PDF, DOC, DOCX, TXT, PNG, JPG, WEBP</p><input id="picker" type="file" multiple accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp"></label><div>${files.map((f,i)=>`<div class="file"><span class="name">${f.name}</span>${f.pending?'<span class="spin"></span><span class="status">Pending</span>':'<span class="status ok">✓ Complete</span>'}<button onclick="files.splice(${i},1);uploadPage()">×</button></div>`).join('')}</div><button class="primary" ${!files.length||files.some(f=>f.pending)?'disabled':''} onclick="summaryPage()">Continue</button></section>`;const picker=document.querySelector('#picker');picker.onchange=()=>addFiles(picker.files);const drop=document.querySelector('#drop');drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)}}
function addFiles(list){[...list].forEach(file=>{if(!files.some(f=>f.name===file.name&&f.size===file.size)){let f={name:file.name,size:file.size,pending:true};files.push(f);setTimeout(()=>{f.pending=false;if(document.querySelector('#picker'))uploadPage()},1200+Math.random()*1000)}});uploadPage()}
function summaryPage(){app.innerHTML=`<section class="card"><h2>Story summary</h2><p class="muted">Your files are uploaded. Before the review, tell the reviewer what your story is about.</p>${files.map(f=>`<div class="file"><span class="name">${escapeHTML(f.name)}</span><b class="ok">✓ Uploaded</b></div>`).join('')}<label><b>Write a short summary of your book, comic, or graphic novel</b><textarea class="field" id="publishSummary" rows="6" placeholder="Describe the main character, the story, and what readers can expect…">${escapeHTML(publishSummary)}</textarea></label><p class="muted">This summary will be included with your submission for review.</p><div class="row"><button type="button" class="secondary" onclick="uploadPage()">← Back to uploads</button><button type="button" id="continueReviewBtn" class="primary">Continue to review →</button></div></section>`;document.querySelector('#continueReviewBtn').addEventListener('click',()=>{const field=document.querySelector('#publishSummary');publishSummary=field.value.trim();if(!publishSummary){alert('Please write a short summary before continuing.');field.focus();return}feedbackPage()})}function escapeHTML(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function analyzeStory(source, title='Your story'){
 const text=source.join(' ').trim(); const words=text.split(/\s+/).filter(Boolean).length;
 const labels=['Introduction','Conflict','Rising Action','Climax','Falling Action','Resolution'];
 const prompts=['How does the story introduce its main character and world?','What specific problem or opposing force drives the story?','Which obstacles make the problem harder to solve?','What decisive high-stakes moment changes the outcome?','What consequences follow the climax?','How is the central problem resolved, and what changes?'];
 const keys=[['begin','start','introduc','once','opens','opening'],['problem','conflict','villain','antagon','threat','must','goal'],['obstacle','challenge','difficult','however','struggle','risk'],['climax','final battle','confront','decide','choice','showdown'],['after','consequence','aftermath','following','result'],['end','finally','resolv','return','learn','realiz','peace']];
 const elementAnswers=source.slice(0,6); const checks=labels.map((label,i)=>({label,ok:elementAnswers[i].length>25||keys[i].some(k=>text.toLowerCase().includes(k)),detail:elementAnswers[i].length>25?'You provided a specific response.':keys[i].some(k=>text.toLowerCase().includes(k))?'There are hints of this element; make it more explicit.':'This element may need more detail.'}));
 const strengths=[]; if(words>=120)strengths.push('You have provided a substantial starting point to review.'); if(/because|therefore|so that|in order to/i.test(text))strengths.push('Some motivations or cause-and-effect connections are already present.'); if(/friend|family|sister|brother|mother|father|team|partner/i.test(text))strengths.push('Relationships appear to play a role in the story.'); if(/fear|hope|learn|change|realiz|believe/i.test(text))strengths.push('The outline hints at emotional development or character change.'); if(checks.filter(x=>x.ok).length>=4)strengths.push('Most of the six story stages are represented in your answers.'); if(!strengths.length)strengths.push('You have taken the first step by putting your story idea into words.');
 const gaps=checks.filter(x=>!x.ok).map(x=>`Add a clearer ${x.label.toLowerCase()}: ${prompts[labels.indexOf(x.label)]}`); if(words<100)gaps.push('Add more concrete detail. Explain what the character wants, what stands in the way, and what is at stake.'); if(!/because|therefore|so that|in order to/i.test(text))gaps.push('Strengthen cause and effect: explain why the character makes important choices and how each choice changes what happens next.');
 return {title,words,checks,strengths,gaps,score:checks.filter(x=>x.ok).length};
}
function reviewerMarkup(result){return `<div class="card" style="background:#edf1e5;margin-top:18px"><h3>Story review</h3><p class="muted">A free, on-page writing checklist based on the information you entered. This is not ChatGPT or an AI model.</p><p><b>${result.score}/6</b> story elements have a clear starting point · <b>${result.words}</b> words reviewed</p><h3>What is working</h3><ul>${result.strengths.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><h3>Six story elements</h3>${result.checks.map(x=>`<div class="file"><b class="name">${x.ok?'✓':'○'} ${x.label}</b><span class="muted">${escapeHTML(x.detail)}</span></div>`).join('')}<h3>Suggestions to improve</h3>${result.gaps.length?`<ul>${result.gaps.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>`:'<p class="muted">All six stages have at least a starting point. Add specific scenes and consequences to deepen them.</p>'}<p class="muted">Use these suggestions as revision prompts, not as a grade. A human reader may interpret your story differently.</p></div>`}
function feedbackPage(){const result=analyzeStory([publishSummary],format||'Submission');app.innerHTML=`<section class="card"><h2>Story reviewer</h2><p class="muted">Review of the summary you provided. Uploaded file contents are not read or stored by this prototype.</p><div class="file"><b>Submission summary</b><span>${escapeHTML(publishSummary)}</span></div>${reviewerMarkup(result)}<h3 style="margin-top:24px">Ask a revision question</h3><p class="muted">This offline helper offers general prompts; it does not generate AI answers.</p>${chat.map(m=>`<div class="chatmsg">${escapeHTML(m)}</div>`).join('')}<form id="chat"><input class="field" id="message" placeholder="What should I improve?"><button class="primary">Get a prompt</button></form><button class="secondary" onclick="summaryPage()">← Edit summary</button></section>`;document.querySelector('#chat').onsubmit=e=>{e.preventDefault();let v=document.querySelector('#message').value.trim();if(v){chat.push('Revision prompt: identify one scene that demonstrates this idea, then explain what changes because of it. Your question: '+v);feedbackPage()}}}
function genresPage(){app.innerHTML=`<section class="card"><h2>Explore Ideas</h2><p class="muted">Select one or more genres.</p>${genreList.map(g=>`<div class="file"><b class="name">${g}</b><button class="secondary" onclick="genres.includes('${g}')?genres=genres.filter(x=>x!=='${g}'):genres.push('${g}');genresPage()">${genres.includes(g)?'✓ Selected':'Select'}</button></div>`).join('')}<p class="muted">Selected: ${genres.join(', ')}</p><button class="primary" ${!genres.length?'disabled':''} onclick="section=0;quizPage()">Confirm genres →</button></section>`}
function quizPage(){app.innerHTML=`<section class="card"><h2>${quiz[section][0]}</h2><p class="muted">Section ${section+1} of 4</p>${quiz[section][1].map((q,i)=>`<label><b>${q}</b><textarea class="field" rows="2" data-q="${section}-${i}" placeholder="Write your answer…">${answers[section+'-'+i]||''}</textarea></label>`).join('')}<div class="row"><button class="secondary" onclick="section=Math.max(0,section-1);quizPage()">← Back</button><button class="primary" onclick="saveQuiz();if(section<3){section++;quizPage()}else if(quiz.every((s,si)=>s[1].every((q,i)=>(answers[si+'-'+i]||'').trim()))){outlinePage()}else alert('Please answer every question first.')">${section===3?'Finish':'Next section →'}</button></div></section>`}
function saveQuiz(){document.querySelectorAll('[data-q]').forEach(e=>answers[e.dataset.q]=e.value)}
function outlinePage(){saveQuiz();app.innerHTML=`<section class="card"><h2>Your story outline</h2><p class="muted">Review your answers before continuing.</p><p>Genres: ${genres.join(', ')}</p><textarea class="field" rows="14">${quiz.map((s,si)=>s[0]+'\n'+s[1].map((q,i)=>q+': '+answers[si+'-'+i]).join('\n')).join('\n\n')}</textarea><button class="primary" onclick="titlePage()">Continue →</button></section>`}
function titlePage(){app.innerHTML=`<section class="card"><h2>Give your story a title</h2><input class="field" id="title" placeholder="Story title"><h3>Choose your format</h3>${['Book','Comic','Graphic novel'].map(f=>`<button class="secondary" onclick="format='${f}';document.querySelectorAll('[data-format]').forEach(x=>x.style.outline='');this.style.outline='2px solid #174c3b'" data-format>${f}</button>`).join('')}<br><button class="primary" onclick="storyTitle=document.querySelector('#title').value.trim();if(!storyTitle||!format){alert('Enter a title and choose a format.');return}generatedPage()">Generate draft →</button></section>`}
function generatedPage(){app.innerHTML=`<section class="card"><h2>Draft preview</h2><h3>${escapeHTML(storyTitle)}</h3><p class="muted">Prototype preview assembled from your story outline. Full AI manuscript generation is not connected.</p><button type="button" class="primary" id="confirmDraftBtn">Confirm draft</button><button type="button" class="secondary" onclick="outlinePage()">Decline and revise</button></section>`;document.querySelector('#confirmDraftBtn').addEventListener('click',()=>{try{reviewPage()}catch(error){console.error('Crafix review error:',error);app.innerHTML=`<section class="card"><h2>Review could not open</h2><p class="muted">Something went wrong while preparing the review. Your answers are still available.</p><button class="secondary" onclick="outlinePage()">Return to outline</button></section>`}})}function reviewPage(){saveQuiz();const src=[];for(let i=0;i<6;i++)src.push(answers['3-'+i]||'');const result=analyzeStory(src,storyTitle);app.innerHTML=`<section class="card"><h2>Review and feedback</h2><p class="muted">Your confirmed ${escapeHTML(format.toLowerCase())} idea: <b>${escapeHTML(storyTitle)}</b></p>${reviewerMarkup(result)}<h3>Revise your outline</h3><p class="muted">Use the suggestions to decide what to strengthen. You can return to your answers and edit them.</p><button class="secondary" onclick="outlinePage()">← Return to outline</button><button class="primary" onclick="publishedPage()">Continue →</button></section>`}
function publishedPage(){app.innerHTML=`<section class="card"><h2>Published</h2><p class="muted">This is the final demonstration stage. Actual public book distribution is not connected.</p><b>${storyTitle}</b><br><button class="primary" onclick="home()">Home</button></section>`}
home();
</script></body></html>
