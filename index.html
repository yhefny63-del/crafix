<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crafix — From imagination to sales</title>
<meta name="description" content="Develop and prepare your book, comic, or graphic novel with Crafix.">
<style>
:root{--sage:#e6eee1;--cream:#fbf7eb;--green:#174c3b;--mid:#397653;--muted:#718071}
*{box-sizing:border-box}body{margin:0;background:var(--sage);color:var(--green);font:16px Arial,sans-serif}
header{max-width:1100px;margin:18px auto 0;background:var(--cream);border-radius:20px;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font: bold 28px Georgia,serif;display:flex;align-items:center;gap:10px}nav{display:flex;gap:22px;flex-wrap:wrap}button{cursor:pointer;border:0;color:inherit;background:none;font:inherit}nav button{font-weight:bold}
main{max-width:1100px;margin:18px auto;padding:0 12px}.hero,.card{background:var(--cream);border-radius:22px;padding:clamp(22px,5vw,52px)}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:350px}
h1{font:clamp(34px,5vw,48px)/1.12 Georgia,serif;margin:16px 0;color:#103c30}h2{font: bold 30px Georgia,serif;margin:0 0 12px}.muted{color:var(--muted);line-height:1.6}.eyebrow{display:inline-block;background:#e7ead6;border-radius:30px;padding:9px 14px;font-size:10px;letter-spacing:2px;font-weight:bold}
.primary,.secondary{border-radius:12px;padding:12px 18px;font-weight:bold;margin-top:12px}.primary{background:var(--green);color:white}.secondary{background:#edf1e8;border:1px solid #dce5d8}.primary:disabled{opacity:.4;cursor:not-allowed}
.illustration{background:linear-gradient(145deg,#e8eddb,#f4f0df);border-radius:22px;min-height:260px;display:grid;place-items:center;padding:18px}
.bottom{text-align:center;padding:28px 0 45px}.bottom small{letter-spacing:3px;font-weight:bold;color:#496653}.symbols{display:flex;justify-content:center;gap:18px;margin-top:18px}.symbols span{width:46px;height:46px;border:2px solid var(--mid);border-radius:50%;display:grid;place-items:center;font-size:23px}
.card{margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{background:#fffdf7;border:1px solid #e0e5d9;border-radius:14px;padding:15px;text-align:left;display:flex;gap:12px;align-items:center}.tile .ico{font-size:25px;color:var(--mid)}
.field{width:100%;border:1px solid #d9e0d2;border-radius:10px;padding:11px;background:white;color:var(--green);margin:5px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.steps{display:flex;justify-content:space-between;margin:20px 0}.step{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e7eadb;font-weight:bold}.step.active{background:var(--green);color:white}.step.done{background:#d3e8d2}
.drop{display:block;border:2px dashed #b6c9b3;border-radius:15px;padding:28px;text-align:center;background:#f0f2e8;cursor:pointer}.file{display:flex;align-items:center;gap:10px;border:1px solid #e0e5d9;border-radius:12px;padding:12px;margin:8px 0}.file .name{flex:1;overflow-wrap:anywhere}.status{font-weight:bold}.ok{color:#287447}.spin{width:17px;height:17px;border:2px solid #dce3d7;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
textarea{resize:vertical} .chatmsg{background:#dce9d9;border-radius:12px;padding:12px;margin:8px 0 8px auto;max-width:85%}
@media(max-width:620px){header{margin:10px;padding:14px}.hero{grid-template-columns:1fr}.illustration{min-height:210px}nav{gap:12px}}
</style></head>
<body>
<header><button class="brand" onclick="home()"><svg width="34" height="34" viewBox="0 0 40 40"><path fill="#4e8965" d="M5 29Q7 9 25 5Q23 24 5 29Z"/><path fill="#174c3b" d="M20 34Q21 14 37 10Q37 28 20 34Z"/></svg>Crafix</button><nav><button onclick="home()">⌂ Home</button><button onclick="genresPage()">♧ Explore Ideas</button><button onclick="tutorialPage()">Publish</button></nav></header>
<main id="app"></main>
<script>
const app=document.querySelector('#app');let slide=0,read=[],format='',files=[],genres=[],answers={},section=0,chat=[],storyTitle='',publishSummary='';
const lessons=[['Scan or download','Scan handwritten pages or download your digital document.'],['Write a summary in the margin','Write a short summary so reviewers understand your story.'],['Upload to the drive','Upload your work and keep the files organized.'],['Move to the site','Move your files to the publishing site.'],['If criticism is received, revise.','Read criticism carefully and revise your work when necessary.']];
const genreList=['Fantasy','Adventure','Mystery','Science Fiction','Comedy','Drama','Horror','Historical','Romance','Action'];
const quiz=[['Character Information',['Character name','Age','Appearance','Personality','Strengths and weaknesses','Motivations and fears','Background and relationships']],['Story and Plot',['Story summary','Main character’s goal','Central problem','Setting','What makes the story unique?','Obstacles']],['Character Arcs',['How does the character begin?','What challenges change them?','What lessons do they learn?','How do they behave at the end?','What kind of character arc?']],['Six Story Elements',['Introduction: How does your story begin?','Conflict: What problem does your main character face?','Rising Action: What obstacles make solving the problem difficult?','Climax: What is the biggest moment in your story?','Falling Action: What happens after the major confrontation?','Resolution: How does your story end?']]];
function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">YOUR STORY STARTS HERE</span><h1>From imagination<br>to sales.</h1><p class="muted">Self-publishing your book, comic, or graphic novel starts with an idea.</p><button class="primary" onclick="startPage()">Start →</button></div><div class="illustration"><svg viewBox="0 0 340 250" width="100%" style="max-width:330px"><path d="M165 190Q103 143 40 166L44 205Q107 185 165 224Q224 185 291 205L295 166Q230 143 165 190Z" fill="#fffdf2" stroke="#659477" stroke-width="3"/><path d="M165 190V224M61 177Q111 161 153 192M179 192Q226 162 275 177" fill="none" stroke="#aac8a5" stroke-width="2.5"/><path d="M165 190V82" stroke="#326c4c" stroke-width="7" stroke-linecap="round"/><path d="M165 112Q98 108 91 68Q147 65 165 112Z" fill="#8eb98a"/><path d="M165 116Q170 47 237 43Q233 99 165 116Z" fill="#397b56"/></svg></div></section><div class="bottom"><small>A PLACE FOR STORIES TO TAKE SHAPE</small><div class="symbols"><span>♧</span><span>▤</span><span>✧</span></div></div>`}
function startPage(){app.innerHTML=`<section class="card"><h2>Where would you like to start?</h2><div class="grid"><button class="tile" onclick="tutorialPage()"><span class="ico">▤</span><span><b>Publish</b><p class="muted">I already have a story to publish.</p></span></button><button class="tile" onclick="genresPage()"><span class="ico">✧</span><span><b>Explore Ideas</b><p class="muted">Help me develop a story idea.</p></span></button></div></section>`}
function tutorialPage(){app.innerHTML=`<section class="card"><h2>Publishing guide</h2><p class="muted">Read all five steps to continue.</p><div class="steps">${lessons.map((x,i)=>`<span class="step ${slide===i?'active':read.includes(i)?'done':''}">${read.includes(i)?'✓':i+1}</span>`).join('')}</div><div class="card" style="background:#edf1e5;text-align:center"><p class="muted">STEP ${slide+1} OF 5</p><h2>${lessons[slide][0]}</h2><p class="muted">${lessons[slide][1]}</p></div><div class="row"><button class="secondary" onclick="slide=Math.max(0,slide-1);tutorialPage()">← Previous</button><button class="secondary" onclick="slide=Math.min(4,slide+1);tutorialPage()">Next →</button></div><button class="secondary" onclick="read.includes(slide)||read.push(slide);tutorialPage()">${read.includes(slide)?'✓ Marked as read':'Mark as read'}</button><br><button class="primary" ${read.length!==5?'disabled':''} onclick="formatsPage()">Continue →</button></section>`}
function formatsPage(){app.innerHTML=`<section class="card"><h2>Choose your format</h2><p class="muted">What are you publishing?</p><div class="grid">${['Book','Comic','Graphic novel'].map(f=>`<button class="tile" onclick="format='${f}';formatsPage()"><span class="ico">▤</span><b>${f} ${format===f?'✓':''}</b></button>`).join('')}</div><button class="primary" ${!format?'disabled':''} onclick="uploadPage()">Continue to upload</button></section>`}
function uploadPage(){app.innerHTML=`<section class="card"><h2>Upload your ${format.toLowerCase()}</h2><p class="muted">Choose files from your device. This GitHub Pages version keeps them in your browser; it does not send or store them on a server.</p><label class="drop" id="drop"><span class="ico" style="font-size:30px">⇧</span><br><b>Choose files or drop them here</b><p class="muted">PDF, DOC, DOCX, TXT, PNG, JPG, WEBP · Select files locally</p><input id="picker" type="file" multiple accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp"></label><div>${files.map((f,i)=>`<div class="file"><span class="name">${f.name}</span><span class="status ok">✓ Selected on this device</span><button onclick="files.splice(${i},1);uploadPage()">×</button></div>`).join('')}</div><button class="primary" ${!files.length||files.some(f=>f.pending)?'disabled':''} onclick="summaryPage()">Continue</button></section>`;const picker=document.querySelector('#picker');picker.onchange=()=>addFiles(picker.files);const drop=document.querySelector('#drop');drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)}}
function addFiles(list){[...list].forEach(file=>{if(!files.some(f=>f.name===file.name&&f.size===file.size)){files.push({name:file.name,size:file.size,pending:false,file})}});uploadPage()}
function summaryPage(){app.innerHTML=`<section class="card"><h2>Story summary</h2><p class="muted">Your files are selected on this device. Before the review, tell the reviewer what your story is about.</p>${files.map(f=>`<div class="file"><span class="name">${f.name}</span><b class="ok">✓ Selected</b></div>`).join('')}<label><b>Write a short summary of your book, comic, or graphic novel</b><textarea class="field" id="publishSummary" rows="6" placeholder="Describe the main character, the story, and what readers can expect…">${publishSummary.replaceAll('&','&amp;').replaceAll('<','&lt;')}</textarea></label><p class="muted">This summary is shown to the reviewer alongside your selected file names. Nothing is sent to a server in this static version.</p><div class="row"><button class="secondary" onclick="uploadPage()">← Back to uploads</button><button class="primary" onclick="publishSummary=document.querySelector('#publishSummary').value.trim();if(!publishSummary){alert('Please write a short summary before continuing.');return}feedbackPage()">Continue to review →</button></div></section>`}function escapeHTML(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function getReviewText(){return Promise.all(files.map(async f=>{if(f.file && /\.(txt|md)$/i.test(f.name)){try{return await f.file.text()}catch(e){return ''}}return ''})).then(parts=>parts.filter(Boolean).join('\n\n'))}
function makeReview(text){const full=(publishSummary+'\n\n'+text).trim();const words=full.match(/\b[\w’'-]+\b/g)||[];const sentences=full.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);const lower=full.toLowerCase();const has=(terms)=>terms.some(t=>lower.includes(t));const sections=[['Introduction',['begin','starts','opens','one day','at first']],['Conflict',['problem','conflict','must','needs to','danger','threat','challenge']],['Rising action',['obstacle','however','but','struggle','difficult','tries','journey']],['Climax',['climax','final battle','confrontation','showdown','decides','must choose']],['Falling action',['afterward','after the battle','consequences','aftermath']],['Resolution',['finally','in the end','at last','resolution','returns','learns','realizes']]];const found=sections.filter(([name,terms])=>has(terms)).map(x=>x[0]);const missing=sections.filter(([name])=>!found.includes(name)).map(x=>x[0]);const strengths=[];if(words.length>=80)strengths.push('There is enough material here to begin examining the story’s direction.');else strengths.push('The summary is concise, which makes the central idea quick to understand.');if(has(['main character','protagonist','hero','girl','boy','young','detective']))strengths.push('The summary appears to identify a central character.');if(has(['because','but','however','although','while']))strengths.push('The summary suggests a cause, contrast, or complication that could drive the plot.');if(has(['wants','goal','tries','must','hopes']))strengths.push('A character goal or intention is suggested.');const improvements=[];if(!has(['wants','goal','tries','must','hopes']))improvements.push('Clarify what the main character wants and why it matters to them.');if(!has(['problem','conflict','danger','threat','challenge','but','however']))improvements.push('Make the central problem or conflict more specific.');if(!has(['because','so that','therefore','as a result']))improvements.push('Explain how the character’s choices cause the next events.');if(sentences.length<3)improvements.push('Add a little more detail about the beginning, a major turning point, and the ending.');if(!has(['end','finally','in the end','at last','resolution','returns','learns','realizes']))improvements.push('Explain how the story ends and what changes for the main character.');if(!improvements.length)improvements.push('Add one concrete example of a difficult choice the main character makes.');const questions=['What does your main character want most?','What makes achieving that goal difficult?','What important choice changes the direction of the story?','How is the character different at the end?'];return {words:words.length,sentences:sentences.length,found,missing,strengths,improvements,questions,hasText:!!text.trim()}}
let currentReview=null,reviewSourceText='';
async function feedbackPage(){app.innerHTML=`<section class="card"><h2>Story Reviewer</h2><p class="muted">A basic, rules-based reviewer will examine your story summary and any selected TXT or Markdown files. It does not use AI or send your writing anywhere.</p><div id="reviewStatus" class="file">Preparing your review…</div><div id="reviewResults"></div><h3 style="margin-top:24px">Ask the reviewer</h3><p class="muted">Ask about the feedback or your story. Replies are generated from simple review rules, not an AI model.</p><div id="reviewChat"></div><form id="reviewChatForm"><input class="field" id="reviewQuestion" placeholder="Ask about your story…" required><button class="primary">Ask reviewer</button></form><button class="secondary" onclick="summaryPage()">← Edit summary</button></section>`;reviewSourceText=await getReviewText();currentReview=makeReview(reviewSourceText);const readable=files.filter(f=>/\.(txt|md)$/i.test(f.name)).length;document.querySelector('#reviewStatus').innerHTML=`<b>Review complete</b><span class="muted">${currentReview.words} words checked · ${readable} readable text file(s)</span>`;document.querySelector('#reviewResults').innerHTML=`<div class="card" style="background:#edf1e5;margin-top:16px"><h3>What the reviewer could examine</h3><p>${currentReview.words} words and ${currentReview.sentences} sentences in the summary${currentReview.hasText?' and readable text file(s)':' . No manuscript text was available to read.'}</p><p class="muted">${files.some(f=>! /\.(txt|md)$/i.test(f.name))?'PDF, Word, and image files are listed but their contents are not read in this version.':''}</p></div><h3>Possible strengths</h3><ul>${currentReview.strengths.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><h3>Suggestions to improve</h3><ul>${currentReview.improvements.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><h3>Story structure checklist</h3><p class="muted">These are keyword clues only, not proof that a story element is present or missing.</p>${[['Introduction', 'Introduction'],['Conflict','Conflict'],['Rising action','Rising action'],['Climax','Climax'],['Falling action','Falling action'],['Resolution','Resolution']].map(([label,key])=>`<div class="file"><span class="name">${label}</span><b class="status ${currentReview.found.includes(key)?'ok':''}">${currentReview.found.includes(key)?'Possible clue found':'Not detected'}</b></div>`).join('')}<h3>Questions to think about</h3><ol>${currentReview.questions.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ol><p class="muted">This is an early checklist, not a quality score or a substitute for feedback from a human editor or reader.</p>`;document.querySelector('#reviewChatForm').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#reviewQuestion').value.trim();if(!q)return;const reply=reviewReply(q);const chat=document.querySelector('#reviewChat');chat.innerHTML+=`<div class="chatmsg"><b>You</b><br>${escapeHTML(q)}</div><div class="file"><div><b>Reviewer</b><br>${escapeHTML(reply)}</div></div>`;document.querySelector('#reviewQuestion').value=''}}
function reviewReply(question){const q=question.toLowerCase();if(q.includes('character'))return 'Try describing what your main character wants, what they fear, and one choice they make that shows their personality. The current reviewer cannot reliably identify characters automatically.';if(q.includes('conflict')||q.includes('problem'))return 'A useful conflict makes the character work for their goal. Explain what stands in their way, what happens if they fail, and why the obstacle is difficult.';if(q.includes('ending')||q.includes('resolution'))return 'Show how the main problem is resolved and what has changed for the character. If you want, add two or three sentences about the ending to your summary and run the review again.';if(q.includes('dialogue'))return 'This basic reviewer does not evaluate dialogue quality. As you revise, check whether each speaker sounds distinct and whether each conversation changes the scene or reveals something important.';if(q.includes('pacing'))return 'This basic reviewer cannot measure pacing reliably. Check whether important scenes have enough space, repeated events can be shortened, and each scene moves the story forward.';if(q.includes('original')||q.includes('originality'))return 'I cannot determine whether a story is original from keywords. Consider what makes your character, setting, problem, or solution distinct, and compare it with stories you know.';if(q.includes('strength'))return currentReview.strengths.join(' ');if(q.includes('improv')||q.includes('fix')||q.includes('suggest'))return currentReview.improvements.join(' ');return 'I can offer basic prompts about characters, conflict, endings, dialogue, pacing, and revision. Try asking one specific question about your story. This reviewer uses simple rules and does not understand your writing like an AI editor would.'}
function genresPage(){app.innerHTML=`<section class="card"><h2>Explore Ideas</h2><p class="muted">Select one or more genres.</p>${genreList.map(g=>`<div class="file"><b class="name">${g}</b><button class="secondary" onclick="genres.includes('${g}')?genres=genres.filter(x=>x!=='${g}'):genres.push('${g}');genresPage()">${genres.includes(g)?'✓ Selected':'Select'}</button></div>`).join('')}<p class="muted">Selected: ${genres.join(', ')}</p><button class="primary" ${!genres.length?'disabled':''} onclick="section=0;quizPage()">Confirm genres →</button></section>`}
function quizPage(){app.innerHTML=`<section class="card"><h2>${quiz[section][0]}</h2><p class="muted">Section ${section+1} of 4</p>${quiz[section][1].map((q,i)=>`<label><b>${q}</b><textarea class="field" rows="2" data-q="${section}-${i}" placeholder="Write your answer…">${answers[section+'-'+i]||''}</textarea></label>`).join('')}<div class="row"><button class="secondary" onclick="section=Math.max(0,section-1);quizPage()">← Back</button><button class="primary" onclick="saveQuiz();if(section<3){section++;quizPage()}else if(quiz.every((s,si)=>s[1].every((q,i)=>(answers[si+'-'+i]||'').trim()))){outlinePage()}else alert('Please answer every question first.')">${section===3?'Finish':'Next section →'}</button></div></section>`}
function saveQuiz(){document.querySelectorAll('[data-q]').forEach(e=>answers[e.dataset.q]=e.value)}
function outlinePage(){saveQuiz();app.innerHTML=`<section class="card"><h2>Your story outline</h2><p class="muted">Review your answers before continuing.</p><p>Genres: ${genres.join(', ')}</p><textarea class="field" rows="14">${quiz.map((s,si)=>s[0]+'\n'+s[1].map((q,i)=>q+': '+answers[si+'-'+i]).join('\n')).join('\n\n')}</textarea><button class="primary" onclick="titlePage()">Continue →</button></section>`}
function titlePage(){app.innerHTML=`<section class="card"><h2>Give your story a title</h2><input class="field" id="title" placeholder="Story title"><h3>Choose your format</h3>${['Book','Comic','Graphic novel'].map(f=>`<button class="secondary" onclick="format='${f}';document.querySelectorAll('[data-format]').forEach(x=>x.style.outline='');this.style.outline='2px solid #174c3b'" data-format>${f}</button>`).join('')}<br><button class="primary" onclick="storyTitle=document.querySelector('#title').value.trim();if(!storyTitle||!format){alert('Enter a title and choose a format.');return}generatedPage()">Generate draft →</button></section>`}
function generatedPage(){app.innerHTML=`<section class="card"><h2>Draft preview</h2><h3>${storyTitle}</h3><p class="muted">Prototype preview assembled from your story outline. Full AI manuscript generation is not connected.</p><button class="primary" onclick="reviewPage()">Confirm draft</button><button class="secondary" onclick="outlinePage()">Decline and revise</button></section>`}
function reviewPage(){app.innerHTML=`<section class="card"><h2>Review and feedback</h2><p class="muted">Your confirmed work is awaiting review. Criticisms and suggestions will appear here when a reviewer provides them.</p><button class="primary" onclick="publishedPage()">Continue</button></section>`}
function publishedPage(){app.innerHTML=`<section class="card"><h2>Published</h2><p class="muted">This is the final demonstration stage. Actual public book distribution is not connected.</p><b>${storyTitle}</b><br><button class="primary" onclick="home()">Home</button></section>`}
home();
</script></body></html>
